plugins {

    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id "androidx.navigation.safeargs.kotlin"
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'org.jetbrains.kotlin.android'

}

String getUnsplashClientId() {

    def propFile = project.rootProject.file("./local.properties")
    def properties = new Properties()
    properties.load(new FileInputStream(propFile))
    return properties['UNSPLASH_CLIENT_ID'] // get from https://unsplash.com/oauth/applications/550960
}

String getManageYourRentersBaseUrl() {

    def propFile = project.rootProject.file("./local.properties")
    def properties = new Properties()
    properties.load(new FileInputStream(propFile))
    return properties['MANAGE_YOUR_RENTERS_BASE_URL']
}

android {
    compileSdk = 36

    defaultConfig {
        applicationId "com.rohitthebest.manageyourrenters"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "v6.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "MANAGE_YOUR_RENTERS_BASE_URL", getManageYourRentersBaseUrl())
        buildConfigField("String", "UNSPLASH_CLIENT_ID", getUnsplashClientId())
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
//        // Flag to enable support for the new language APIs (https://developer.android.com/studio/write/java8-support#groovy)
//        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        disable "JvmStaticProvidesInObjectDetector", "FieldSiteTargetOnQualifierAnnotation", "ModuleCompanionObjects", "ModuleCompanionObjectsNotInModuleParent"
    }

    lintOptions {
        baseline file("lint-baseline.xml")
    }

    buildFeatures {

        viewBinding true
        buildConfig = true
    }
    namespace 'com.rohitthebest.manageyourrenters'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // for taking permissions and doing some of the stuffs that was done with Intent before
    implementation "androidx.activity:activity-ktx:1.11.0"
    implementation "androidx.fragment:fragment-ktx:1.8.9"

    //Firebase
    implementation(platform("com.google.firebase:firebase-bom:34.2.0"))
    implementation("com.google.firebase:firebase-auth")
    implementation('com.google.firebase:firebase-storage')
    implementation('com.google.firebase:firebase-firestore')
    implementation('com.google.firebase:firebase-analytics')

    //attaches coroutines with firebase
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    def credential_version = "1.5.0"
    implementation "androidx.credentials:credentials:$credential_version"
    implementation "androidx.credentials:credentials-play-services-auth:$credential_version"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"

    //for google signIn button
    implementation 'com.google.android.gms:play-services-auth:21.4.0'

    def room_version = "2.8.0"

    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:$room_version"

    def lifecycle_version = "2.9.3"
    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    // Saved state module for ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    // Annotation processor
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // Coroutine Lifecycle Scopes
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Glide
    implementation 'com.github.bumptech.glide:glide:5.0.4'
    kapt 'com.github.bumptech.glide:compiler:5.0.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    //Gson
    implementation "com.google.code.gson:gson:2.13.1"

    //Recycler View
    implementation "androidx.recyclerview:recyclerview:1.4.0"


    //Dagger-Hilt
    def daggerHilt_version = '2.57.1'
    implementation "com.google.dagger:hilt-android:$daggerHilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$daggerHilt_version"

    implementation "androidx.hilt:hilt-lifecycle-viewmodel:1.3.0"
    kapt "androidx.hilt:hilt-compiler:1.3.0"

    // Navigation Components
    def nav_component = '2.9.4'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_component"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_component"

    //sentry
    implementation 'io.sentry:sentry-android:8.21.1'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    // okhttp
    implementation "com.squareup.okhttp3:okhttp:5.1.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.1.0"

    //paging 3.0
    implementation "androidx.paging:paging-runtime-ktx:3.3.6"

    // pretty time library
    implementation 'org.ocpsoft.prettytime:prettytime:4.0.4.Final'

    //Any chart library for showing graphs - don't update the dependency
    implementation 'com.github.AnyChart:AnyChart-Android:1.1.2'

    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.9.1'

    //https://developer.android.com/studio/write/java8-support#groovy
//    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
//    // don't change the version until gradle plugin is updated to 7.4.0-alpha10

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}